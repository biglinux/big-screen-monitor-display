<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161B22" />
      <stop offset="100%" stop-color="#0D1117" />
    </linearGradient>
    <linearGradient id="screen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1F2937" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
  </defs>
  <!-- Background Frame -->
  <rect x="2" y="2" width="60" height="60" rx="14" ry="14" fill="url(#bg)" stroke="#30363D" stroke-width="1.5" />
  <!-- Monitor Bezel -->
  <rect x="6" y="8" width="52" height="38" rx="5" ry="5" fill="#21262D" stroke="#58A6FF" stroke-width="2" />
  <!-- LCD Screen Area -->
  <rect x="10" y="12" width="44" height="30" rx="2" ry="2" fill="url(#screen)" />
  <!-- Screen Telemetry Lines -->
  <polyline points="14,32 22,24 30,28 38,18 48,22" fill="none" stroke="#42E8FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="14" y="36" width="20" height="3" rx="1.5" ry="1.5" fill="#3FB950" />
  <rect x="36" y="36" width="14" height="3" rx="1.5" ry="1.5" fill="#F044DB" />
  <!-- Stand & Base -->
  <rect x="26" y="46" width="12" height="6" fill="#58A6FF" />
  <rect x="18" y="52" width="28" height="3" rx="1.5" ry="1.5" fill="#58A6FF" />
</svg>
