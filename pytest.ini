[pytest]
filterwarnings =
    # A file, pipe or socket left open is a bug (the SmartMonitor capture leaked
    # two pipes per theme change before this was turned into an error).
    error::ResourceWarning
    error::pytest.PytestUnraisableExceptionWarning
    # Raised inside PyGObject itself (3.56 on Python 3.14), not by this project:
    # its asyncio integration uses the policy API deprecated in Python 3.14, and
    # loading the GLib overrides touches GLib.unix_signal_add_full. Our own code
    # uses GLibUnix.signal_add (bsmd/media/agent.py). Remove when PyGObject is fixed.
    ignore:'asyncio\.:DeprecationWarning:gi\.events
    ignore:GLib\.unix_signal_add_full is deprecated:DeprecationWarning:gi\.overrides
