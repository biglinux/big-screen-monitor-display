name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 with both Qt bindings; 3.10 is the minimum the package declares
        # (python>=3.10) and 3.14 is what Arch/BigLinux ship today.
        python: ["3.12"]
        qt: ["PyQt6", "PyQt5"]
        include:
          - python: "3.10"
            qt: "PyQt6"
          - python: "3.14"
            qt: "PyQt6"
    name: pytest (Python ${{ matrix.python }}, ${{ matrix.qt }})
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: |
          sudo apt-get update
          # gettext/rsvg/fonts: themes; libegl1/libxkbcommon0/libdbus: headless Qt for the tray apps
          sudo apt-get install -y gettext librsvg2-bin fontconfig fonts-dejavu-core shellcheck \
            libegl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0
          pip install pytest pytest-cov ruff pillow numpy psutil pyusb pyserial "${{ matrix.qt }}"
      - name: Lint (ruff)
        if: matrix.python == '3.12' && matrix.qt == 'PyQt6'
        run: ruff check .
      - name: Run tests
        if: matrix.python != '3.12' || matrix.qt != 'PyQt6'
        run: python -m pytest -q tests
      - name: Run tests with coverage
        # The floor only goes up (PLANNING.md, Fase 3.3). Without a display the
        # GTK window tests are skipped, so this is lower than a local run.
        if: matrix.python == '3.12' && matrix.qt == 'PyQt6'
        run: |
          python -m pytest -q tests --cov=usr/share/big-screen-monitor-display --cov-report=term:skip-covered \
            --cov-fail-under=60
      - name: Check the shell scripts
        if: matrix.python == '3.12' && matrix.qt == 'PyQt6'
        run: shellcheck -s bash install-system.sh uninstall-system.sh run-local.sh pkgbuild/pkgbuild.install tools/update-pot.sh tools/release.sh
      - name: Validate translations
        if: matrix.python == '3.12' && matrix.qt == 'PyQt6'
        run: |
          for po in locale/*.po; do if [ -s "$po" ]; then msgfmt -c -o /dev/null "$po"; fi; done

