name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        qt: ["PyQt6", "PyQt5"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          sudo apt-get update
          # gettext/rsvg/fonts: themes; libegl1/libxkbcommon0/libdbus: headless Qt for the tray apps
          sudo apt-get install -y gettext librsvg2-bin fontconfig fonts-dejavu-core shellcheck \
            libegl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0
          pip install pytest pillow numpy psutil pyusb pyserial "${{ matrix.qt }}"
      - name: Run tests
        run: python -m pytest -q tests
      - name: Check the shell scripts
        if: matrix.qt == 'PyQt6'
        run: shellcheck -s bash install-system.sh uninstall-system.sh run-local.sh pkgbuild/pkgbuild.install
      - name: Validate translations
        if: matrix.qt == 'PyQt6'
        run: |
          for po in locale/*.po; do if [ -s "$po" ]; then msgfmt -c -o /dev/null "$po"; fi; done
