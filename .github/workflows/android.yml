name: Android app

on:
  push:
    paths:
      - "android/**"
      - "tests/data/bsdp-vectors.json"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - "tests/data/bsdp-vectors.json"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      # The runner's Android SDK (licences accepted) is used as it is; AGP fetches platform 36.
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.7.1"
      - name: Unit tests (protocol vectors shared with the computer's tests)
        run: gradle -p android --no-daemon --stacktrace testDebugUnitTest
      - name: Lint
        run: gradle -p android --no-daemon lintDebug
      - name: Debug APK
        run: gradle -p android --no-daemon assembleDebug
      - name: Release APK
        # Signed only when the repository has the signing secrets; otherwise an
        # unsigned release APK is built (never published as a signed release).
        env:
          BSMD_KEYSTORE_BASE64: ${{ secrets.BSMD_KEYSTORE_BASE64 }}
          BSMD_KEYSTORE_PASSWORD: ${{ secrets.BSMD_KEYSTORE_PASSWORD }}
          BSMD_KEY_ALIAS: ${{ secrets.BSMD_KEY_ALIAS }}
          BSMD_KEY_PASSWORD: ${{ secrets.BSMD_KEY_PASSWORD }}
        run: |
          if [ -n "$BSMD_KEYSTORE_BASE64" ]; then
            echo "$BSMD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export BSMD_KEYSTORE="$RUNNER_TEMP/release.jks"
          fi
          gradle -p android --no-daemon assembleRelease
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: big-screen-monitor-display-android
          path: |
            android/app/build/outputs/apk/**/*.apk
            android/app/build/reports/lint-results-*.html
            android/app/build/reports/tests/
          if-no-files-found: warn
